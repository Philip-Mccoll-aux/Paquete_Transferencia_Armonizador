[project]
name = "armonizador-lt"
version = "0.1.0"
description = "Armonizador mensual de energía LT bajo medidores persistentes M"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
]

[project.scripts]
armonizador-lt = "armonizador.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["armonizador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
